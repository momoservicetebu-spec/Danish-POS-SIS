<style>
  :root {
    --bg-canvas: #F4F6F9;
    --surface: #FFFFFF;
    --border: #E2E8F0;
    --text-main: #0F172A;
    --text-muted: #64748B;
    
    /* Warna Fungsional Action Tiles sesuai PRD v3.1[cite: 4] */
    --emerald: #10B981;
    --royal-blue: #2563EB;
    --sky-blue: #0284C7;
    --amber: #F59E0B;
    --violet: #7C3AED;
    --slate: #475569;
    --teal: #0D9488;
    --crimson: #DC2626;
    --online-green: #16A34A;
    --offline-orange: #EA580C;
  }

  * { box-sizing: border-box; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
  
  /* Viewport Terkunci 100vh Non-Scrolling[cite: 3] */
  html, body {
    margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden;
    background-color: var(--bg-canvas); color: var(--text-main);
    user-select: none;
  }

  .pos-wrapper {
    display: flex; flex-direction: column; height: 100vh; padding: 12px; gap: 12px;
  }

  /* Top Header Bar (~64px)[cite: 4] */
  .pos-header {
    height: 60px; background: var(--surface); border-radius: 16px;
    border: 1px solid var(--border); box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04);
    padding: 0 20px; display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }

  .status-pill {
    padding: 6px 14px; border-radius: 999px; font-size: 12px; font-weight: 700;
    color: #fff; display: inline-flex; align-items: center; gap: 6px;
  }
  .status-online { background: var(--online-green); }
  .status-offline { background: var(--offline-orange); animation: pulse 1.5s infinite; }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.65; }
  }

  /* Bento Grid Utama: Kiri 65% | Kanan 35%[cite: 4] */
  .pos-bento {
    display: grid; grid-template-columns: 65fr 35fr; gap: 14px;
    flex: 1; min-height: 0;
  }

  .col-left, .col-right {
    display: flex; flex-direction: column; gap: 12px; min-height: 0;
  }

  .card {
    background: var(--surface); border-radius: 16px; border: 1px solid var(--border);
    box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04); padding: 16px;
  }

  /* Input Scan Barcode Auto-Focus[cite: 4] */
  .scan-card { display: flex; gap: 10px; align-items: center; flex-shrink: 0; }
  .scan-input {
    flex: 1; font-size: 18px; font-weight: 600; padding: 12px 16px;
    border: 2px solid var(--royal-blue); border-radius: 12px; outline: none;
  }

  /* Tabel Daftar Belanja dengan Internal Scroll Mandiri[cite: 3] */
  .cart-card {
    flex: 1; display: flex; flex-direction: column; min-height: 0; padding: 0; overflow: hidden;
  }
  .cart-scroll { flex: 1; overflow-y: auto; }
  .cart-table { width: 100%; border-collapse: collapse; }
  .cart-table th {
    position: sticky; top: 0; background: #F8FAFC; padding: 12px 14px;
    text-align: left; font-size: 12px; color: var(--text-muted); border-bottom: 1px solid var(--border);
  }
  .cart-table td { padding: 12px 14px; border-bottom: 1px solid var(--border); font-size: 14px; }
  .cart-row.selected { background: #EFF6FF; }
  .num { font-variant-numeric: tabular-nums; text-align: right; }

  /* Kartu Grand Total & Promo Alert[cite: 4] */
  .total-card {
    background: #0F172A; color: #FFFFFF; border-radius: 16px; padding: 20px; flex-shrink: 0;
  }
  .grand-total-val {
    font-size: 40px; font-weight: 800; font-variant-numeric: tabular-nums;
    color: #34D399; margin: 4px 0; text-align: right;
  }
  .promo-alert {
    display: none; background: #7C3AED; color: #fff; padding: 8px 12px;
    border-radius: 10px; font-size: 12px; font-weight: 600; margin-top: 8px;
  }

  /* Panel Color-Coded Action Tiles[cite: 4] */
  .action-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; flex: 1;
  }
  .tile-btn {
    border: none; border-radius: 14px; color: #FFFFFF; padding: 12px 14px;
    display: flex; flex-direction: column; justify-content: space-between;
    align-items: flex-start; cursor: pointer; font-weight: 700; font-size: 13px;
    transition: transform 0.1s;
  }
  .tile-btn:active { transform: scale(0.98); }
  .kbd-badge {
    background: rgba(0, 0, 0, 0.25); padding: 2px 7px; border-radius: 6px;
    font-size: 11px; font-family: monospace;
  }

  .bg-emerald { background: var(--emerald); }
  .bg-royal { background: var(--royal-blue); }
  .bg-sky { background: var(--sky-blue); }
  .bg-amber { background: var(--amber); }
  .bg-violet { background: var(--violet); }
  .bg-slate { background: var(--slate); }
  .bg-teal { background: var(--teal); }
  .bg-crimson { background: var(--crimson); }

  .btn-checkout {
    height: 68px; background: var(--emerald); color: #fff; border: none;
    border-radius: 16px; font-size: 20px; font-weight: 800; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between; padding: 0 24px;
    flex-shrink: 0;
  }

  /* Modal Overlay */
  .modal-backdrop {
    display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.55);
    align-items: center; justify-content: center; z-index: 50;
  }
  .modal-box {
    background: #fff; border-radius: 16px; width: 100%; max-width: 480px;
    padding: 24px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
  }
  .modal-box input, .modal-box select {
    width: 100%; padding: 12px; border: 1px solid var(--border);
    border-radius: 10px; font-size: 15px; margin-bottom: 12px;
  }
</style>
