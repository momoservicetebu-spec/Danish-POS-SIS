<script>
  const SESSION = JSON.parse(localStorage.getItem('POS_SESSION') || 'null');
  const DEVICE_ID = localStorage.getItem('POS_DEVICE_ID') || 'UNKNOWN_DEV';

  if (!SESSION) {
    window.top.location.href = window.location.href.split('?')[0] + '?page=login';
  }

  const ApiClient = {
    call: function(endpoint, payload) {
      return new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler(res => {
            if (res.status === 200) resolve(res.data);
            else reject(new Error(res.error || 'Terjadi kesalahan server.'));
          })
          .withFailureHandler(err => reject(err))
          .apiRouter({
            endpoint: endpoint,
            token: SESSION.token,
            deviceId: DEVICE_ID,
            storeCode: SESSION.store.kodeToko,
            clientTimestamp: new Date().toISOString(),
            payload: payload || {}
          });
      });
    },

    // Sinkronisasi antrean transaksi offline ke server secara otomatis[cite: 7]
    syncQueue: async function() {
      const pill = document.getElementById('syncStatusPill');
      if (!navigator.onLine) {
        if (pill) {
          pill.className = 'status-pill status-offline';
          pill.textContent = '● OFFLINE (Local Queue)';
        }
        return;
      }

      try {
        const pending = await LocalDB.getPendingTransactions();
        if (pending.length > 0) {
          const res = await this.call('pos/sync-trx', { transactions: pending });
          if (res.syncedIds && res.syncedIds.length > 0) {
            await LocalDB.markTransactionsSynced(res.syncedIds);
          }
        }
        if (pill) {
          pill.className = 'status-pill status-online';
          pill.textContent = '● ONLINE & SYNCED';
        }
      } catch (e) {
        if (pill) {
          pill.className = 'status-pill status-offline';
          pill.textContent = '● QUEUE PENDING (' + e.message.slice(0, 18) + ')';
        }
      }
    }
  };

  // Jalankan pengecekan sinkronisasi setiap 15 detik[cite: 7]
  setInterval(() => ApiClient.syncQueue(), 15000);
  window.addEventListener('online', () => ApiClient.syncQueue());
  window.addEventListener('offline', () => ApiClient.syncQueue());
</script>
