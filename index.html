<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Danish POS & SIS v3.5</title>
  <script>
    const session = JSON.parse(localStorage.getItem('POS_SESSION') || 'null');
    if (session && session.token) {
      window.location.replace(session.user.role === 'Kasir' ? 'kasir.html' : 'admin.html');
    } else {
      window.location.replace('login.html');
    }
  </script>
</head>
<body>
  <p style="font-family:sans-serif; padding:20px;">Mengarahkan ke halaman login...</p>
</body>
</html>
